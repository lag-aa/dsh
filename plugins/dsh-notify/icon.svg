<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Уведомления">
  <!-- A bell with an unread badge: the two things this plugin puts in front of a
       person — an OS toast and a message sent to a webhook. The badge is cut out
       of the bell rather than outlined, so the gap works on any background. -->
