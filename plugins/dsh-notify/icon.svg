    <rect width="36" height="36" fill="#ffffff"/>
    <circle cx="26.6" cy="9.4" r="5.6" fill="#000000"/>
  </mask>
  <g mask="url(#badgeGap)" fill="#2F6FEB">
    <path d="M18 6.2c-3.9 0-7.06 3.16-7.06 7.06v5.3l-1.9 3.5c-.6 1.1.2 2.44 1.45 2.44h15.02c1.25 0 2.05-1.34 1.45-2.44l-1.9-3.5v-5.3c0-3.9-3.16-7.06-7.06-7.06Z"/>
    <path d="M18 28.6c-1.75 0-3.22-1.2-3.6-2.82h7.2c-.38 1.62-1.85 2.82-3.6 2.82Z"/>
  </g>
  <circle cx="26.6" cy="9.4" r="4.15" fill="#E5695F"/>
</svg>
